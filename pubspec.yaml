name: chess_ai_coach
description: A Flutter chess app with AI coaching powered by Stockfish and Claude.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Chess logic
  chess: ^0.8.1

  # Stockfish engine
  stockfish_chess_engine: ^0.8.2

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP for Claude API
  http: ^1.2.1

  # SVG rendering for chess pieces
  flutter_svg: ^2.0.10+1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Shared preferences for simple settings
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # assets: []
